name: Deploy to Azure Functions

on:
  push:
    branches:
      - main

env:
  AZURE_FUNCTIONAPP_NAME: 'cw2-function-jam'   # set this to your application's name
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'       # set this to the path to your web app project, defaults to the repository root
  NODE_VERSION: '20.x'                      # set this to the node version to use (supports 8.x, 10.x, 12.x)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v3

      - name: Setup Node ${{ env.NODE_VERSION }} Environment
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Rely on Kudu (SCM) to build during deployment via SCM_DO_BUILD_DURING_DEPLOYMENT
      # This keeps the zip small and avoids local node_modules packaging issues.

      - name: 'Create deployment zip (Functions only)'
        shell: bash
        run: |
          set -e
          rm -f deploy.zip
          zip -r deploy.zip \
            host.json \
            package.json \
            src \
            uploadItem \
            getItems \
            getItem \
            updateItem \
            deleteItem
          echo "Zip created:"
          ls -lah deploy.zip
          echo "Zip contents:"
          unzip -l deploy.zip

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: './deploy.zip'
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
